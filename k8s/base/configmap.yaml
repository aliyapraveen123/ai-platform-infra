apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-task-platform-config
data:
  NODE_ENV: production
  PORT: "4000"
  TRUST_PROXY: "true"
  MONGODB_URI: mongodb://mongodb:27017/ai_task_platform
  REDIS_URL: redis://redis:6379
  TASK_STREAM_KEY: ai-task-platform:tasks
  TASK_CONSUMER_GROUP: ai-task-platform:workers
  FRONTEND_ORIGIN: https://tasks.example.com